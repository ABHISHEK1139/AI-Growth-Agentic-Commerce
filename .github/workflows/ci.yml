name: CI / Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Static Type Analysis (mypy)
        run: |
          mypy apps packages services pipeline

      - name: Architecture Boundary Verification (import-linter)
        run: |
          lint-imports

      - name: Unit Tests
        run: |
          pytest tests/unit/ -v

      - name: Contract Tests
        run: |
          pytest tests/contract/ -v

      - name: Security & Boundary Tests
        run: |
          pytest tests/security/ -v

      - name: Pipeline Property Tests
        run: |
          pytest -k pipeline -v

  frontend-quality:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Web Dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build Next.js Production App
        working-directory: apps/web
        run: npm run build

      - name: Lint Next.js App
        working-directory: apps/web
        run: npm run lint

  docker-build:
    name: Docker Image Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: false
          tags: agentpay-api:ci

      - name: Build Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/worker.Dockerfile
          push: false
          tags: agentpay-worker:ci

      - name: Build Web Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: false
          tags: agentpay-web:ci

  migrations-and-integration:
    name: Migrations & Integration Smoke Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agentpay
          POSTGRES_PASSWORD: agentpay
          POSTGRES_DB: agentpay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentpay -d agentpay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Apply Alembic Migrations
        env:
          DATABASE_URL: postgresql+psycopg://agentpay:agentpay@localhost:5432/agentpay
        run: |
          alembic -c infra/migrations/alembic.ini upgrade head

      - name: Seed Demo Catalog & Policies
        env:
          DATABASE_URL: postgresql+psycopg://agentpay:agentpay@localhost:5432/agentpay
          REDIS_URL: redis://localhost:6379/0
        run: |
          python -m apps.worker.seed_catalog

      - name: Run Integration Tests
        env:
          DATABASE_URL: postgresql+psycopg://agentpay:agentpay@localhost:5432/agentpay
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest tests/integration/ -m integration -v || true

  alerting-and-operations:
    name: Alerting Module & Operations Scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Unit Tests for Alerting Module
        # Phase 9 acceptance: alerting module is exercised by tests, not just
        # inspected by code review. The redactor, queue cap, and severity
        # filtering are covered here.
        run: |
          pytest tests/unit/test_operations_alerts.py -v

      - name: Operations Script Argument Tests
        # Phase 9 acceptance: backup / restore procedure is exercised in CI.
        # The script's argument handling and redaction are covered here
        # without touching a real PostgreSQL.
        run: |
          pytest tests/operations/ -v

      - name: Verify CLI Help Strings
        # Operator runbooks point at ``python -m infra.operations.backup`` and
        # ``python -m infra.operations.restore``. The help text must be
        # loadable and mention the documented flags; a typo'd flag silently
        # breaks the runbook.
        run: |
          python -m infra.operations.backup --help
          python -m infra.operations.restore --help

  security-scan:
    name: Security & Dependency Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pip-audit bandit

      - name: Secret Scan (gitleaks)
        # Catches credentials that should not have been committed. The
        # repository's .gitleaks.toml customises the scan to ignore
        # .env.example and tests' fixture secrets.
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Static Security Analysis (bandit)
        # Catches the common Python security anti-patterns (eval, exec,
        # shell=True, hard-coded passwords). The output is non-blocking
        # unless HIGH severity is set as a hard gate; we report and let
        # the PR author fix.
        run: |
          bandit -r apps packages services infra -f json -o bandit-report.json || true
          bandit -r apps packages services infra -lll || true

      - name: Dependency Vulnerability Scan (pip-audit)
        run: |
          pip-audit --strict --requirement <(python -c "import tomllib; print('\n'.join(tomllib.load(open('pyproject.toml','rb'))['project']['dependencies']))")

  browser-e2e:
    name: Browser End-to-End (Smoke)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js 20
        uses: setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Web Dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build Next.js (verifies the production bundle)
        working-directory: apps/web
        run: npm run build

      # A real browser-driven payment flow is not part of the unit suite
      # because it requires Razorpay test-mode keys; that is exercised in
      # a separate, scheduled workflow against a real staging URL. This
      # smoke job verifies the build is shippable.
